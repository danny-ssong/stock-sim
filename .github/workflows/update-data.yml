name: 데이터 자동 갱신

on:
  schedule:
    # 매일 07:23 UTC(한국시간 16:23) — 미국 장 마감 확정 + ECOS 당일 고시 이후.
    #
    # 정시(분=0)를 피한다. GitHub의 스케줄 큐는 매시 정각에 몰려 무료 러너에서
    # 몇 시간씩 밀리는데, 실제로 07:00으로 걸었을 때 12:00~19:15 UTC 사이에
    # 시작해 매번 5~12시간 지연됐다. 어중간한 분으로 옮기면 그 경합을 피한다.
    #
    # 지연 자체는 GitHub가 보장하지 않는 영역이라 완전히 없앨 수는 없다. 다만
    # 늦게 돌아도 결과는 같다 — 수집은 "마지막으로 받은 날짜 이후"를 가져오는
    # 증분 방식이라 하루를 건너뛰어도 다음 실행이 따라잡는다.
    #
    # 요일별로 스케줄을 둘로 나눈 이유는 아래 "수집 모드 결정" 참고.
    - cron: '23 7 * * 1-6'
    - cron: '23 7 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: '수집 모드'
        type: choice
        options:
          - incremental
          - full
        default: incremental

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # data/raw는 .gitignore 대상(재현 가능한 캐시)이라 git에는 없다.
      # 증분 수집이 "어제까지 받은 마지막 날짜"를 알 수 있도록 러너 간에 이 캐시를 이어준다.
      # key는 매 실행 고유값(run_id)이라 항상 새로 저장되고, restore-keys 접두사로 가장 최근
      # 캐시를 복원한다 — actions/cache는 같은 key를 덮어쓰지 못하기 때문에 쓰는 관용 패턴이다.
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: data-raw-${{ github.run_id }}
          restore-keys: |
            data-raw-

      # 주 1회는 소급 수정(리버스 스플릿 등)을 잡으려고 전체를 다시 요청한다.
      #
      # 그 "주 1회"를 실행 시각(date -u +%u)으로 판정하면 안 된다 — 스케줄이 몇
      # 시간씩 밀려 자정을 넘기면 일요일에 걸어둔 실행이 월요일에 시작해 요일
      # 판정이 어긋나고, 전체 재요청이 조용히 영영 건너뛰어진다. 대신 어느 cron이
      # 깨웠는지(github.event.schedule)를 본다 — 이 값은 실제 시작 시각과 무관하게
      # 스케줄 정의 그대로라 지연에 영향받지 않는다.
      - name: 수집 모드 결정
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_MODE: ${{ github.event.inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "value=$DISPATCH_MODE" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = "23 7 * * 0" ]; then
            echo "value=full" >> "$GITHUB_OUTPUT"
          else
            echo "value=incremental" >> "$GITHUB_OUTPUT"
          fi

      - name: 원천 데이터 수집
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: npx tsx scripts/fetch-raw.ts --mode=${{ steps.mode.outputs.value }}

      - name: 산출물 빌드
        run: npm run build-data

      - name: 변경 사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git status --porcelain public/data | grep -q .; then
            git add public/data
            git commit -m "chore: 데이터 자동 갱신 ($(date -u +%F), ${{ steps.mode.outputs.value }})"
            git push
          else
            echo "변경된 데이터가 없어 커밋을 건너뜁니다."
          fi
